<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Components - Lab System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden text-gray-900">

    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200">
        <div class="p-4 border-b">
            <h2 class="text-xl font-bold text-gray-800">Lab System</h2>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="dashboard.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Dashboard</a>
            <a href="components.html" class="block px-4 py-2 rounded-lg bg-blue-50 text-blue-700 font-medium">Components</a>
            <a href="students.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Students</a>
            <a href="transactions.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">IN/OUT</a>
            <a href="reports.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Reports</a>
        </nav>
    </aside>

    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
            <h1 class="text-2xl font-bold text-gray-900">Component Stock</h1>
            <div class="flex flex-wrap gap-2">
                <button id="downloadSampleBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-lg text-sm font-medium">
                    ⬇ Sample CSV
                </button>
                <input type="file" id="csvFileInput" accept=".csv" class="hidden">
                <button id="uploadCsvBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
                    ⬆ Upload CSV
                </button>
                <button id="showAddModalBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium">
                    + Add Item
                </button>
            </div>
        </div>

        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="Search components..." class="w-full md:w-1/2 border border-gray-300 rounded-lg p-2.5">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="componentsGrid">
            <p class="text-gray-500">Loading components...</p>
        </div>
    </main>

    <nav class="md:hidden fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center h-16 z-50">
        <a href="dashboard.html" class="flex flex-col items-center text-gray-500">Home</a>
        <a href="components.html" class="flex flex-col items-center text-blue-600">Stock</a>
        <a href="transactions.html" class="flex flex-col items-center text-gray-500">IN/OUT</a>
        <a href="students.html" class="flex flex-col items-center text-gray-500">Students</a>
    </nav>

    <!-- Add Component Modal -->
    <div id="addCompModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6">
            <h2 class="text-xl font-bold mb-4">Add New Component</h2>
            <form id="addCompForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Item Name</label>
                    <input type="text" id="compName" required class="mt-1 w-full border rounded-lg p-2" placeholder="e.g. Multimeter">
                </div>
                <div>
                    <label class="block text-sm font-medium">Category</label>
                    <select id="compCategory" class="mt-1 w-full border rounded-lg p-2">
                        <option value="NON_CONSUMABLE">Non-Consumable (Returnable)</option>
                        <option value="CONSUMABLE">Consumable (Wire, Tape)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium">Total Quantity</label>
                    <input type="number" id="compQty" required min="1" class="mt-1 w-full border rounded-lg p-2">
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" id="closeModalBtn" class="px-4 py-2 text-gray-600">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Return Component Modal -->
    <div id="returnCompModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6">
            <h2 class="text-xl font-bold mb-4">Return Component: <span id="returnCompName" class="text-green-600"></span></h2>
            <form id="returnCompForm" class="space-y-4">
                <input type="hidden" id="returnCompId">
                <div>
                    <label class="block text-sm font-medium mb-1">Select Active Transaction</label>
                    <select id="returnTxSelect" required class="w-full border rounded-lg p-2.5"></select>
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" id="closeReturnModalBtn" class="px-4 py-2 text-gray-600">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-lg">Confirm Return</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Direct Issue Modal -->
    <div id="issueCompModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6">
            <h2 class="text-xl font-bold mb-4">Issue Component: <span id="issueCompName" class="text-blue-600"></span></h2>
            <form id="directIssueForm" class="space-y-4">
                <input type="hidden" id="issueCompId">
                <input type="hidden" id="issueCompCategory">
                <input type="hidden" id="issueCompAvail">
                <div>
                    <label class="block text-sm font-medium mb-1">Select Student (Search)</label>
                    <select id="issueStudentSelect" required class="w-full"></select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Quantity</label>
                        <input type="number" id="issueQty" required min="1" class="w-full border rounded-lg p-2.5 border-gray-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Purpose</label>
                        <input type="text" id="issuePurpose" required class="w-full border rounded-lg p-2.5 border-gray-300" placeholder="e.g. Practical">
                    </div>
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" id="closeIssueModalBtn" class="px-4 py-2 text-gray-600">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Confirm Issue</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/components.js"></script>
</body>
</html>
