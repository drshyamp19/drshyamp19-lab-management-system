<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Components - Lab System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden text-gray-900">

    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200">
        <div class="p-4 border-b">
            <h2 class="text-xl font-bold text-gray-800">Lab System</h2>
            <p class="text-sm text-gray-500" id="userRoleDisplay">Loading...</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="dashboard.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Dashboard</a>
            <a href="components.html" class="block px-4 py-2 rounded-lg bg-blue-50 text-blue-700 font-medium">Components</a>
            <a href="students.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Students</a>
            <a href="transactions.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">IN/OUT</a>
            <a href="labs.html" id="navLabs" class="hidden block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Labs</a>
        </nav>
        <div class="p-4 border-t">
            <button id="logoutBtn" class="w-full text-left px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg font-medium">Logout</button>
        </div>
    </aside>

    <main class="flex-1 p-4 md:p-8 overflow-y-auto pb-24 md:pb-8">
        <header class="mb-4 flex flex-wrap items-center justify-between gap-3">
            <div>
                <h1 class="text-2xl font-bold">Components</h1>
                <p class="text-gray-500 text-sm">Consumable / Non-Consumable stock manage करा.</p>
            </div>
            <button id="showFormBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg">+ Add Component</button>
        </header>

        <div class="flex flex-wrap gap-3 mb-4">
            <input id="searchBox" placeholder="Search by Name or Code..." class="flex-1 min-w-[200px] px-3 py-2 border border-gray-300 rounded-lg">
            <select id="labFilter" class="hidden px-3 py-2 border border-gray-300 rounded-lg"></select>
            <select id="categoryFilter" class="px-3 py-2 border border-gray-300 rounded-lg">
                <option value="">All Categories</option>
                <option value="consumable">Consumable</option>
                <option value="non-consumable">Non-Consumable</option>
            </select>
        </div>

        <div id="compForm" class="hidden bg-white p-4 rounded-xl border border-gray-100 shadow-sm mb-6 space-y-3">
            <input type="hidden" id="compId">
            <div class="grid md:grid-cols-3 gap-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Name</label>
                    <input id="compName" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Code (unique per lab)</label>
                    <input id="compCode" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Category</label>
                    <select id="compCategory" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                        <option value="consumable">Consumable</option>
                        <option value="non-consumable">Non-Consumable</option>
                    </select>
                </div>
            </div>
            <div class="grid md:grid-cols-3 gap-3">
                <div id="compLabWrap" class="hidden">
                    <label class="block text-sm font-medium text-gray-700">Lab</label>
                    <select id="compLab" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Total Quantity</label>
                    <input type="number" min="0" id="compTotal" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Minimum Stock</label>
                    <input type="number" min="0" id="compMinStock" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                </div>
            </div>
            <div class="grid md:grid-cols-3 gap-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Unit</label>
                    <input id="compUnit" placeholder="pcs / meter / box" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Rack/Location</label>
                    <input id="compLocation" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Status</label>
                    <select id="compStatus" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Description</label>
                <textarea id="compDescription" rows="2" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg"></textarea>
            </div>
            <p id="compError" class="text-red-500 text-sm hidden"></p>
            <div class="flex gap-2">
                <button id="saveCompBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg">Save</button>
                <button id="cancelCompBtn" class="px-4 py-2 rounded-lg border border-gray-300">Cancel</button>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 text-gray-500 text-left">
                    <tr>
                        <th class="p-3">Name</th>
                        <th class="p-3">Code</th>
                        <th class="p-3">Category</th>
                        <th class="p-3">Available/Total</th>
                        <th class="p-3">Status</th>
                        <th class="p-3">Action</th>
                    </tr>
                </thead>
                <tbody id="compTableBody"></tbody>
            </table>
        </div>
    </main>

    <nav class="md:hidden fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center h-16 z-50">
        <a href="dashboard.html" class="flex flex-col items-center text-gray-500 text-xs">Home</a>
        <a href="components.html" class="flex flex-col items-center text-blue-600 text-xs">Stock</a>
        <a href="transactions.html" class="flex flex-col items-center text-gray-500 text-xs">IN/OUT</a>
        <a href="students.html" class="flex flex-col items-center text-gray-500 text-xs">Students</a>
    </nav>

    <script type="module" src="js/components.js"></script>
</body>
</html>
