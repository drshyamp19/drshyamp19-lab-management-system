<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Lab System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden text-gray-900">

    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200">
        <div class="p-4 border-b">
            <h2 class="text-xl font-bold text-gray-800">Lab System</h2>
            <p class="text-xs text-red-600 font-bold mt-1">ADMIN PANEL</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="dashboard.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Dashboard</a>
            <a href="users.html" class="block px-4 py-2 rounded-lg bg-blue-50 text-blue-700 font-medium">Manage Users</a>
        </nav>
    </aside>

    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">System Users</h1>
            <button id="showAddModalBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium">
                + Add User
            </button>
        </div>

        <!-- Users Table -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200">
                        <th class="p-4 text-sm font-semibold text-gray-600">Name</th>
                        <th class="p-4 text-sm font-semibold text-gray-600">Email</th>
                        <th class="p-4 text-sm font-semibold text-gray-600">Role</th>
                        <th class="p-4 text-sm font-semibold text-gray-600">Access Permissions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="4" class="p-4 text-center text-gray-500">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Add User Modal -->
    <div id="addUserModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6">
            <h2 class="text-xl font-bold mb-4">Add New User</h2>
            <form id="addUserForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Full Name</label>
                    <input type="text" id="userName" required class="mt-1 w-full border rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium">Email Address</label>
                    <input type="email" id="userEmail" required class="mt-1 w-full border rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium">Password (Min 6 chars)</label>
                    <input type="password" id="userPassword" required minlength="6" class="mt-1 w-full border rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium">Role</label>
                    <select id="userRole" class="mt-1 w-full border rounded-lg p-2">
                        <option value="HOD">HOD</option>
                        <option value="IN_CHARGE">Lab In-Charge</option>
                        <option value="ASSISTANT">Lab Assistant</option>
                    </select>
                </div>
                
                <!-- Access Control Checkboxes -->
                <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Give Access To:</label>
                    <div class="grid grid-cols-2 gap-2 text-sm text-gray-800">
                        <label class="flex items-center"><input type="checkbox" name="permissions" value="components" class="mr-2" checked> Components</label>
                        <label class="flex items-center"><input type="checkbox" name="permissions" value="students" class="mr-2" checked> Students</label>
                        <label class="flex items-center"><input type="checkbox" name="permissions" value="transactions" class="mr-2" checked> IN/OUT</label>
                        <label class="flex items-center"><input type="checkbox" name="permissions" value="reports" class="mr-2"> Reports</label>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" id="closeModalBtn" class="px-4 py-2 text-gray-600">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Create Account</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/users.js"></script>
</body>
</html>
