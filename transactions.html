<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IN/OUT - Lab System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden text-gray-900">

    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200">
        <div class="p-4 border-b">
            <h2 class="text-xl font-bold text-gray-800">Lab System</h2>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="dashboard.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Dashboard</a>
            <a href="components.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Components</a>
            <a href="students.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Students</a>
            <a href="transactions.html" class="block px-4 py-2 rounded-lg bg-blue-50 text-blue-700 font-medium">IN/OUT</a>
            <a href="reports.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Reports</a>
        </nav>
    </aside>

    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">IN / OUT Transactions</h1>

        <div class="flex space-x-4 mb-6 border-b border-gray-200 pb-2">
            <button id="tabOut" class="font-bold text-blue-600 border-b-2 border-blue-600 px-2 py-1">OUT (Issue)</button>
            <button id="tabIn" class="font-bold text-gray-500 hover:text-gray-700 px-2 py-1">IN (Return)</button>
        </div>

        <!-- OUT FORM -->
        <div id="formOut" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 max-w-2xl">
            <form id="issueForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Select Student</label>
                    <select id="outStudent" required class="mt-1 w-full border rounded-lg p-3"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium">Select Component</label>
                    <select id="outComponent" required class="mt-1 w-full border rounded-lg p-3"></select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Quantity</label>
                        <input type="number" id="outQty" required min="1" class="mt-1 w-full border rounded-lg p-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Purpose</label>
                        <input type="text" id="outPurpose" required class="mt-1 w-full border rounded-lg p-3" placeholder="e.g. Practical 1">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg mt-4">Confirm OUT</button>
            </form>
        </div>

        <!-- IN FORM -->
        <div id="formIn" class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-200 max-w-2xl">
            <form id="returnForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Select Active Issue</label>
                    <select id="inTransaction" required class="mt-1 w-full border rounded-lg p-3"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium">Condition</label>
                    <select id="inCondition" class="mt-1 w-full border rounded-lg p-3">
                        <option value="Good">Good (Add to stock)</option>
                        <option value="Damaged">Damaged (Do not add to stock)</option>
                        <option value="Missing">Missing</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg mt-4">Confirm IN</button>
            </form>
        </div>
    </main>

    <script type="module" src="js/transactions.js"></script>
</body>
</html>
