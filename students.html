<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Lab System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden text-gray-900">

    <!-- Desktop Sidebar -->
    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200">
        <div class="p-4 border-b">
            <h2 class="text-xl font-bold text-gray-800">Lab System</h2>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="dashboard.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Dashboard</a>
            <a href="components.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Components</a>
            <a href="students.html" class="block px-4 py-2 rounded-lg bg-blue-50 text-blue-700 font-medium">Students</a>
            <a href="transactions.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">IN/OUT</a>
            <a href="reports.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Reports</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
            <h1 class="text-2xl font-bold text-gray-900">Student Master</h1>
            <div class="flex flex-wrap gap-2">
                <button id="downloadSampleBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-lg text-sm font-medium">
                    ⬇ Sample CSV
                </button>
                <input type="file" id="csvFileInput" accept=".csv" class="hidden">
                <button id="uploadCsvBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
                    ⬆ Upload CSV
                </button>
                <button id="showAddModalBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium">
                    + Add Student
                </button>
            </div>
        </div>

        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="Search students by Name or UID..." class="w-full md:w-1/2 border border-gray-300 rounded-lg p-2.5">
        </div>

        <!-- Students Table -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200">
                        <th class="p-4 text-sm font-semibold text-gray-600">UID</th>
                        <th class="p-4 text-sm font-semibold text-gray-600">Name</th>
                        <th class="p-4 text-sm font-semibold text-gray-600">Course</th>
                        <th class="p-4 text-sm font-semibold text-gray-600 text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr><td colspan="4" class="p-4 text-center text-gray-500">Loading students...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="md:hidden fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center h-16 z-50">
        <a href="dashboard.html" class="flex flex-col items-center text-gray-500">Home</a>
        <a href="components.html" class="flex flex-col items-center text-gray-500">Stock</a>
        <a href="transactions.html" class="flex flex-col items-center text-gray-500">IN/OUT</a>
        <a href="students.html" class="flex flex-col items-center text-blue-600">Students</a>
    </nav>

    <!-- Add Student Modal -->
    <div id="addStudentModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6">
            <h2 class="text-xl font-bold mb-4">Add New Student</h2>
            <form id="addStudentForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Student UID (e.g. STU001)</label>
                    <input type="text" id="stuUid" required class="mt-1 w-full border rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium">Full Name</label>
                    <input type="text" id="stuName" required class="mt-1 w-full border rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium">Course</label>
                    <input type="text" id="stuCourse" required class="mt-1 w-full border rounded-lg p-2">
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" id="closeModalBtn" class="px-4 py-2 text-gray-600">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Return Modal (For Student) -->
    <div id="returnCompModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6">
            <h2 class="text-xl font-bold mb-4">Return from: <span id="returnStudentName" class="text-green-600"></span></h2>
            <form id="returnCompForm" class="space-y-4">
                <input type="hidden" id="returnStudentUid">
                <div>
                    <label class="block text-sm font-medium mb-1">Select Active Transaction</label>
                    <select id="returnTxSelect" required class="w-full border rounded-lg p-2.5"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-600">Issued Quantity</label>
                    <input type="number" id="inIssuedQty" readonly class="w-full border rounded-lg p-2.5 bg-gray-100 text-gray-500 cursor-not-allowed">
                </div>
                <div class="flex items-center justify-between mt-4">
                    <h3 class="text-md font-semibold text-gray-800">Return Conditions</h3>
                    <button type="button" id="btnAllGood" class="text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded hover:bg-blue-200 font-medium transition-colors">All Good</button>
                </div>
                <div class="grid grid-cols-3 gap-4 border-t border-gray-100 pt-4">
                    <div>
                        <label class="block text-sm font-medium mb-1 text-green-700">Good Qty</label>
                        <input type="number" id="returnGoodQty" required min="0" value="0" class="w-full border rounded-lg p-2.5 border-green-300 focus:ring-green-500 focus:border-green-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-red-700">Damaged</label>
                        <input type="number" id="returnDamagedQty" required min="0" value="0" class="w-full border rounded-lg p-2.5 border-red-300 focus:ring-red-500 focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-orange-700">Missing</label>
                        <input type="number" id="returnMissingQty" required min="0" value="0" class="w-full border rounded-lg p-2.5 border-orange-300 focus:ring-orange-500 focus:border-orange-500">
                    </div>
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" id="closeReturnModalBtn" class="px-4 py-2 text-gray-600">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-lg">Confirm Return</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Direct Issue Modal (For Student) -->
    <div id="issueCompModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6">
            <h2 class="text-xl font-bold mb-4">Issue to: <span id="issueStudentName" class="text-blue-600"></span></h2>
            <form id="directIssueForm" class="space-y-4">
                <input type="hidden" id="issueStudentUid">
                
                <div>
                    <label class="block text-sm font-medium mb-1">Select Component (Search)</label>
                    <select id="issueCompSelect" required class="w-full"></select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Quantity</label>
                        <input type="number" id="issueQty" required min="1" class="w-full border rounded-lg p-2.5 border-gray-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Purpose</label>
                        <input type="text" id="issuePurpose" required class="w-full border rounded-lg p-2.5 border-gray-300" placeholder="e.g. Practical">
                    </div>
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" id="closeIssueModalBtn" class="px-4 py-2 text-gray-600">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Confirm Issue</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Student History Modal -->
    <div id="studentHistoryModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-3xl w-full p-6 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">History: <span id="historyStudentName" class="text-blue-600"></span></h2>
                <button type="button" id="closeStudentHistoryBtn" class="text-gray-500 hover:text-gray-700 text-2xl font-bold">&times;</button>
            </div>
            <div class="overflow-y-auto flex-1">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200">
                            <th class="p-3 text-sm font-semibold text-gray-600">Date</th>
                            <th class="p-3 text-sm font-semibold text-gray-600">Component</th>
                            <th class="p-3 text-sm font-semibold text-gray-600">Qty</th>
                            <th class="p-3 text-sm font-semibold text-gray-600">Status</th>
                        </tr>
                    </thead>
                    <tbody id="studentHistoryTableBody">
                        <tr><td colspan="4" class="p-3 text-center text-gray-500">Loading history...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="js/students.js"></script>
</body>
</html>
