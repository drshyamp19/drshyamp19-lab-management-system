<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labs - Lab System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden text-gray-900">

    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200">
        <div class="p-4 border-b">
            <h2 class="text-xl font-bold text-gray-800">Lab System</h2>
            <p class="text-sm text-gray-500" id="userRoleDisplay">Loading...</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="dashboard.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Dashboard</a>
            <a href="components.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Components</a>
            <a href="students.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">Students</a>
            <a href="transactions.html" class="block px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-50">IN/OUT</a>
            <a href="labs.html" id="navLabs" class="hidden block px-4 py-2 rounded-lg bg-blue-50 text-blue-700 font-medium">Labs</a>
        </nav>
        <div class="p-4 border-t">
            <button id="logoutBtn" class="w-full text-left px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg font-medium">Logout</button>
        </div>
    </aside>

    <main class="flex-1 p-4 md:p-8 overflow-y-auto pb-24 md:pb-8">
        <div id="accessDenied" class="hidden text-center py-20 text-gray-500">
            ही सुविधा फक्त HOD साठी उपलब्ध आहे.
        </div>

        <div id="labsContent" class="hidden">
            <header class="mb-6 flex flex-wrap items-center justify-between gap-3">
                <div>
                    <h1 class="text-2xl font-bold">Labs</h1>
                    <p class="text-gray-500 text-sm">Laboratory तयार करा आणि In-charge/Assistant assign करा.</p>
                </div>
                <button id="showFormBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg">+ Add Lab</button>
            </header>

            <div id="labForm" class="hidden bg-white p-4 rounded-xl border border-gray-100 shadow-sm mb-6 space-y-3">
                <input type="hidden" id="labId">
                <div class="grid md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Lab Name</label>
                        <input id="labName" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="e.g. Electronics Lab">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Status</label>
                        <select id="labStatus" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea id="labDescription" rows="2" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg"></textarea>
                </div>
                <div class="grid md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Lab In-charge</label>
                        <select id="labIncharge" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Lab Assistant</label>
                        <select id="labAssistant" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg"></select>
                    </div>
                </div>
                <p id="labError" class="text-red-500 text-sm hidden"></p>
                <div class="flex gap-2">
                    <button id="saveLabBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg">Save</button>
                    <button id="cancelLabBtn" class="px-4 py-2 rounded-lg border border-gray-300">Cancel</button>
                </div>
            </div>

            <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50 text-gray-500 text-left">
                        <tr>
                            <th class="p-3">Lab Name</th>
                            <th class="p-3">In-charge</th>
                            <th class="p-3">Assistant</th>
                            <th class="p-3">Status</th>
                            <th class="p-3">Action</th>
                        </tr>
                    </thead>
                    <tbody id="labsTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <nav class="md:hidden fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center h-16 z-50">
        <a href="dashboard.html" class="flex flex-col items-center text-gray-500 text-xs">Home</a>
        <a href="components.html" class="flex flex-col items-center text-gray-500 text-xs">Stock</a>
        <a href="transactions.html" class="flex flex-col items-center text-gray-500 text-xs">IN/OUT</a>
        <a href="students.html" class="flex flex-col items-center text-gray-500 text-xs">Students</a>
    </nav>

    <script type="module" src="js/labs.js"></script>
</body>
</html>
